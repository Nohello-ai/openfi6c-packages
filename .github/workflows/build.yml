name: build-packages

# 两个包都是 Architecture: all（纯 shell + JS + JSON，没有 C 代码），
# 所以只需要 SDK 的打包能力，不需要编译工具链 —— 一轮几分钟就能出包。
#
#   ipk  → OpenWrt/ImmortalWrt 24.10 及更早（opkg）
#   apk  → OpenWrt/ImmortalWrt 25.12 及更新（apk-tools 3）
#
# 版本号按时间（Asia/Shanghai），每次提交出一个 Release。

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-packages
  cancel-in-progress: true

jobs:
  # 结构一致性 + AT 串口互斥测试。
  # 不需要 SDK、不需要真设备，几十秒就跑完 —— 但能挡住几类【运行期不报错、
  # 只会静默失效】的问题：配置段重复、ACL 漏授权脚本、菜单指向不存在的视图、
  # 脚本丢了执行位、JSON/JS 语法错、以及 6 个调用者抢同一根串口。
  test:
    name: 结构一致性 + AT 锁测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 【重要】预检:把"编译会不会挂"这件事在【编译之前】就查出来。
      # 之前吃过亏:feed 扫描器只认 Makefile 里的 'call BuildPackage' 字符串,
      # SMS 包漏了这行 → 扫描器看不见它 → 固件那边配置符号变未知 → 断言失败,
      # 而包 CI 因为直接 cp 进 package/ 编译、不走扫描器,一直是绿的。
      # 两边行为不一致,排查了好几轮。现在这些检查在推之前/编译之前就做。
      - name: 预检（feed 扫描器识别 / git 跟踪 / Makefile 字段 / YAML / 脚本语法）
        run: sh tests/preflight.sh

      - name: 跑测试
        run: sh tests/run.sh
  build:
    name: ${{ matrix.release }} → ${{ matrix.fmt }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - release: "24.10.5"
            fmt: ipk
          - release: "25.12.2"
            fmt: apk

    steps:
      - uses: actions/checkout@v4

      - name: 安装宿主依赖
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            build-essential clang flex bison g++ gawk gettext git \
            libncurses-dev libssl-dev python3 python3-setuptools python3-venv \
            rsync unzip wget zstd file

      - name: 找到 SDK
        id: sdk
        run: |
          set -e
          BASE="https://downloads.immortalwrt.org/releases/${{ matrix.release }}/targets/mediatek/filogic/"
          FILE=$(curl -fsSL "$BASE" | grep -oE 'immortalwrt-sdk-[^"<>]*Linux-x86_64\.tar\.(zst|xz)' | head -1)
          if [ -z "$FILE" ]; then
            echo "::error::$BASE 里没找到 SDK"
            exit 1
          fi
          echo "base=$BASE" >> "$GITHUB_OUTPUT"
          echo "file=$FILE" >> "$GITHUB_OUTPUT"
          echo "SDK = $FILE"

      - name: 缓存 SDK + feeds
        uses: actions/cache@v4
        with:
          path: |
            .cache/sdk
            .cache/feeds
          key: immwrt-${{ matrix.release }}-${{ steps.sdk.outputs.file }}

      - name: 下载 SDK
        run: |
          set -e
          mkdir -p .cache/sdk
          F=".cache/sdk/${{ steps.sdk.outputs.file }}"
          if [ -f "$F" ]; then
            echo "命中缓存：$F"
          else
            curl -fL --retry 3 --retry-all-errors --max-time 900 -o "$F" "${{ steps.sdk.outputs.base }}${{ steps.sdk.outputs.file }}"
          fi
          ls -la .cache/sdk

      - name: 解包 SDK
        run: |
          set -e
          mkdir -p work
          tar -xf ".cache/sdk/${{ steps.sdk.outputs.file }}" -C work --strip-components=1
          echo "--- SDK 内容 ---"
          ls work

      - name: 恢复 feeds 缓存
        run: |
          if [ -d .cache/feeds ]; then
            cp -a .cache/feeds work/feeds
            echo "feeds 命中缓存"
          else
            echo "feeds 冷启动"
          fi

      - name: 更新并安装 feeds
        working-directory: work
        run: |
          # 缓存回来的 feeds 停在 detached HEAD —— base feed 指向 immortalwrt 主仓，
          # 而 feeds update 内部是 git pull，在 detached HEAD 上会报
          # "You are not currently on a branch" 然后 failed（第二轮就是这么挂的）。
          #
          # 索引文件 feeds/*.index 在，就说明缓存完整，直接用、跳过 update。
          # 这是安全的：SDK 版本本身把各 feed 钉在具体提交上，而缓存 key 里绑了
          # SDK 文件名 —— 上游发新 SDK 时缓存自动失效重来。
          if ls feeds/*.index >/dev/null 2>&1; then
            echo "feeds 命中缓存（索引已在），跳过 update"
          else
            echo "feeds 冷启动，执行 update"
            ./scripts/feeds update -a
          fi
          ./scripts/feeds install -a

      - name: 把构建时间写进包版本
        run: |
          D="$(TZ=Asia/Shanghai date +%Y%m%d%H%M)"
          sed -i "s/^PKG_RELEASE:=.*/PKG_RELEASE:=$D/" \
            luci-app-openfi-modem/Makefile luci-app-openfi-fan/Makefile \
            luci-app-openfi-sms/Makefile
          grep -H -E '^PKG_(NAME|VERSION|RELEASE)' luci-app-openfi-*/Makefile

      - name: 放入我们的包
        run: |
          cp -a luci-app-openfi-modem luci-app-openfi-fan luci-app-openfi-sms work/package/
          ls -d work/package/luci-app-openfi-*

      - name: 选包
        working-directory: work
        run: |
          cat >> .config <<'EOF'
          CONFIG_PACKAGE_luci-app-openfi-modem=m
          CONFIG_PACKAGE_luci-app-openfi-fan=m
          # sms 依赖 modem(共用串口锁),必须一起编
          CONFIG_PACKAGE_luci-app-openfi-sms=m
          EOF
          make defconfig

      - name: 编译
        working-directory: work
        run: |
          # 顺序有讲究:modem 先编(sms 依赖它)
          # 编译失败的原始输出会被 GitHub 藏进日志，而日志接口需要登录才能读。
          # 所以这里把最后 40 行吐成 ::error:: —— 它会出现在 check 注解里，
          # 未登录也能通过 API 读出来，省得每次都靠猜。
          for p in luci-app-openfi-modem luci-app-openfi-fan luci-app-openfi-sms; do
            if ! make -j"$(nproc)" "package/$p/compile" V=s 2>&1 | tail -60; then
              echo "::error::编译 $p 失败"
              exit 1
            fi
          done

      - name: 收集产物
        run: |
          set -e
          mkdir -p dist
          find work/bin/packages -type f -name 'luci-app-openfi-*' -exec cp -v {} dist/ \;
          echo "--- 产物 ---"
          ls -la dist
          test -n "$(ls -A dist)"

      - name: 保存 feeds 缓存
        if: always()
        run: |
          rm -rf .cache/feeds
          cp -a work/feeds .cache/feeds 2>/dev/null || true

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: pkgs-${{ matrix.fmt }}
          path: dist/*
          if-no-files-found: error

  release:
    name: 发布（按时间）
    # 测试不过就不发版（test 只要几十秒，不会拖慢 build）
    needs: [build, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: 版本号（Asia/Shanghai）
        id: ver
        run: |
          TAG="v$(TZ=Asia/Shanghai date +%Y%m%d-%H%M)"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "版本号：$TAG"

      - name: 生成 MD5
        run: |
          cd dist
          md5sum * | tee MD5SUMS.txt
          echo "--- 文件清单 ---"
          ls -la

      - name: 创建 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: OpenFi 6C packages ${{ steps.ver.outputs.tag }}
          body: |
            OpenFi 6C 的两个 LuCI 包，一次出两种包格式：

            | 文件后缀 | 适用固件 | 包管理器 | 装法 |
            | --- | --- | --- | --- |
            | `.ipk` | OpenWrt / ImmortalWrt **24.10 及更早** | opkg | `opkg install ./xxx.ipk` |
            | `.apk` | OpenWrt / ImmortalWrt **25.12 及更新** | apk-tools 3 | `apk add --allow-untrusted ./xxx.apk` |

            - **`luci-app-openfi-modem`** —— 移动网络：模组信息与卡槽 / 信号与流量 / AT 终端
            - **`luci-app-openfi-sms`** —— 短信：列表与弹窗看全文 / 发送 / 删除（依赖 modem，共用串口锁）
            - **`luci-app-openfi-fan`** —— 散热与灯光：风扇控制 / 状态灯

            两个包都是 `Architecture: all`，跟 CPU 架构无关，装完刷新 LuCI 即可看到菜单。
            各文件的 MD5 见 `MD5SUMS.txt`。
          files: dist/*
          generate_release_notes: true
